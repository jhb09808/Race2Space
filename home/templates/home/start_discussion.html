{% extends 'home/base.html' %}

{% block title %}Start a New Discussion — Race2Space{% endblock %}

{% block content %}
<div class="start-discussion">
    <div class="jumbotron">
        <p class="eyebrow">Community</p>
        <h1 class="display-4">Start a New Discussion</h1>
        <p class="lead">Share your thoughts and engage with the community by starting a new discussion.</p>
    </div>

    <div class="panel form-panel">
        <form action="{% url 'create_discussion' %}" method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" class="form-control" id="subject" name="subject" required>
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea class="form-control" id="message" name="message" rows="4" required></textarea>
            </div>
            <div class="form-group">
                <label for="name">Name (optional)</label>
                <input type="text" class="form-control" id="name" name="name" placeholder="Anonymous">
            </div>
            <button type="submit" class="btn btn-primary">Post discussion</button>
        </form>
    </div>
</div>

<style>
    .start-discussion { max-width: 720px; margin: 0 auto; }
    .form-panel { padding: 1.8rem; }
</style>
{% endblock %}
